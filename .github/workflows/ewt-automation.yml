name: EWT Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run automation
        run: npm start
        env:
          EWT_USER: ${{ secrets.EWT_USER }}
          EWT_PASS: ${{ secrets.EWT_PASS }}
          CI: true

      - name: Upload screenshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-all
          path: screenshots/
          if-no-files-found: ignore
